  <title
     id="t3">TaskFlow API — sequence diagram</title>
  <desc
     id="d3">Two scenarios. Scenario 1, update a task: the client sends PUT /api/tasks/{id}; the controller calls TaskService.updateTask, which finds the task in the in-memory repository, copies title and completed, saves it, and returns 200 with the task JSON; a missing id yields TaskNotFoundException and 404. Scenario 2, AI summary: the client sends GET /api/tasks/summary; the controller lists tasks, computes statistics locally, and (when non-empty) prompts the OpenRouter chat model through Spring AI ChatClient; the returned HTML fragment is passed to the client unvalidated; empty model content or a provider failure yields 500.</desc>
