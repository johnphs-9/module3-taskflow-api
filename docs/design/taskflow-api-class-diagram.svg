  <title
     id="t2">TaskFlow API — class diagram</title>
  <desc
     id="d2">UML-style class diagram of the seven project classes plus the external Spring AI ChatClient. TaskController depends on TaskService and ChatClient; TaskService depends on TaskRepository and Task; TaskRepository stores Task; GlobalExceptionHandler maps TaskNotFoundException to 404, validation errors to 400 and other exceptions to 500, returning ErrorResponse. TaskflowApiApplication boots the Spring context.</desc>
