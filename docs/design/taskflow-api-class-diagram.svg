  <title
     id="title1">TaskFlow API — Class diagram</title>
  <desc
     id="desc1">Class diagram of the TaskFlow API. TaskController (REST, /api/tasks) delegates to TaskService, which delegates to the in-memory TaskRepository; the repository aggregates Task model objects. The controller also depends on the external Spring AI ChatClient for the summary endpoint. TaskService throws TaskNotFoundException, which GlobalExceptionHandler handles and renders as an ErrorResponse. The controller also throws TaskNotFoundException for a 404. The generated HTML summary is not validated or sanitised.</desc>
