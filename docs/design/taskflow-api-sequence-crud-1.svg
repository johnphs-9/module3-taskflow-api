  <title
     id="t4">TaskFlow API — sequence diagram: CRUD flows</title>
  <desc
     id="d4">Three CRUD scenarios. Create: POST /api/tasks validates the title (blank title yields 400 via the handler); the service creates the task in the repository, which assigns an id from its sequence, overriding any id in the body; 201 with the created task. Delete: DELETE /api/tasks/{id}; the repository reports whether the id existed — absent yields TaskNotFoundException and 404, otherwise 200 with an empty body. Dummy: POST /api/tasks/dummy adds five sample tasks without deduplication; 201 with an empty body.</desc>
