  <title
     id="title1">TaskFlow API — Sequence: CRUD flows (find all, find by ID, create)</title>
  <desc
     id="desc1">Sequence diagram of the three basic CRUD flows. Find all: the client GETs /api/tasks, the controller delegates to TaskService, which asks the in-memory TaskRepository for a copy of the list, returned to the client as 200. Find by ID: the repository returns an Optional; if empty the controller throws TaskNotFoundException and the global handler answers 404, otherwise the task is returned as 200. Create: a blank title fails @Valid with 400; otherwise the repository assigns the next ID, stores the task, and the created task is returned as 201.</desc>
