  <title
     id="title1">TaskFlow API — Sequence: AI summary</title>
  <desc
     id="desc1">Sequence diagram of the GET /api/tasks/summary flow. The controller asks TaskService for all tasks, which reads the in-memory repository. If the list is empty the controller returns a static HTML summary without calling the model. Otherwise it computes verified statistics, builds a prompt treating titles as untrusted data, and calls the Spring AI ChatClient, which posts to the OpenRouter hosted model using the OPENAI_API_KEY. The model returns an HTML fragment; a null or blank result raises IllegalStateException and becomes a 500, otherwise the fragment is returned as 200. The generated HTML is not validated or sanitised.</desc>
