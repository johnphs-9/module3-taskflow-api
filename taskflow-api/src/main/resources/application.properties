# Shared configuration for dev and prod.
# Select a profile with SPRING_PROFILES_ACTIVE=dev or SPRING_PROFILES_ACTIVE=prod.
spring.application.name=taskflow-api
spring.profiles.active=dev

# No profile is selected by default; profile-specific logging overrides require selection.
# Supply OPENAI_API_KEY through the environment; never store credentials here.

# Spring AI - oMLX local model (OpenAI-compatible server)
# Available models on your omlx server (http://localhost:8000/v1/models):
#   Qwen3.8-27B-MLX-4bit, Qwen3.8-27B-MTP-4bit, GLM-4.7-Flash-6bit
# spring.ai.openai.api-key=${OPENAI_API_KEY}
# spring.ai.openai.base-url=http://localhost:8000/v1
# spring.ai.openai.chat.model=Qwen3.8-27B-MLX-4bit
# spring.ai.openai.chat.temperature=0.4
# spring.ai.openai.chat.top-p=0.9

# Alternative: Ollama local models (uses the existing OpenAI-compatible starter)
# Small models for a learning demo using synthetic CRM data:
#   llama3.2:1b - Recommended starting point: lightweight, simple English FAQ/chat.
#   llama3.2:3b - More capable alternative if your hardware can run it comfortably.
#   gemma3:1b   - Another lightweight text-only FAQ/chat candidate.
# Local inference has no per-token API fee, but uses your hardware and electricity;
# check each model's license before commercial use. Keep Ollama bound to localhost.
# Local Ollama requires no API key; "ollama" is a non-secret client placeholder.
# spring.ai.openai.api-key=ollama
# spring.ai.openai.base-url=http://localhost:11434
# spring.ai.openai.chat.completions-path=/v1/chat/completions
# spring.ai.openai.chat.model=llama3.2:1b
# spring.ai.openai.chat.temperature=0.4
# spring.ai.model.embedding=none

# Alternative: OpenRouter hosted models 
# Small free learning-demo candidate (catalog checked 2026-10-23):
#   liquid/lfm-2.5-2.6b:free - Compact 2.6B model; try for simple FAQ/chat.
#   nvidia/llama-nemotron-embed-vl-1b-v2:free
# Hosted response speed depends on provider load and rate limits, not just size.
# Use synthetic CRM records; small models can hallucinate and misuse tools.
# Free models have rate limits and availability can change; no production SLA assumed.
# Check current IDs/pricing at https://openrouter.ai/models?max_price=0
# Hosted inference sends prompts to external providers: review retention policies
# and redact customer PII/secrets before sending CRM data.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=openrouter/free
spring.ai.openai.embedding.model=nvidia/llama-nemotron-embed-vl-1b-v2:free
spring.ai.openai.embedding.encoding-format=float
spring.ai.openai.chat.temperature=0.4
spring.ai.openai.chat.top-p=0.9
